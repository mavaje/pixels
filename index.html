<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PIXELS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <script type="module" src="./src.js"></script>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <canvas id="pixel-grid">Unsupported</canvas>
    <div id="block-borders"></div>
    <div id="toolbox" class="glass">
        <div id="pan-tool" class="button">
            <div class="icon icon-pan"></div>
            <div id="pan-badges" class="badges"></div>
        </div>
        <div class="vr"></div>
        <div id="add-pip" class="button animate">
            <div class="icon icon-add"></div>
        </div>
    </div>
    <div id="picker" class="glass hidden">
        <div id="slider-h" class="slider"></div>
        <div id="slider-s" class="slider"></div>
        <div id="slider-l" class="slider"></div>
        <div class="hr"></div>
        <div id="slider-r" class="slider"></div>
        <div id="slider-g" class="slider"></div>
        <div id="slider-b" class="slider"></div>
        <div id="picker-tools">
            <div id="pick-tool" class="button animate">
                <div class="icon icon-pick"></div>
            </div>
            <input id="hex-input" type="text">
            <div id="remove-pip" class="button animate">
                <div class="icon icon-remove"></div>
            </div>
        </div>
    </div>
    <svg class="hidden">
        <defs>
            <clipPath id="icon-pick">
                <path d="M1,1 L3,1 12,10 10,12 1,3 Z"/>
                <path d="M11,5 L12,6 6,12 5,11 Z"/>
                <circle cx="12" cy="12" r="3"/>
            </clipPath>
        </defs>
    </svg>
    <a id="downloader" download="pixels.png" hidden></a>
</body>
</html>
