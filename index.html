<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PIXELS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <script type="module" src="./src.js"></script>
    <link id="favicon" rel="icon"/>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <canvas id="pixel-grid">Unsupported</canvas>
    <div id="ghost-layer">
        <div id="pixel-preview"></div>
    </div>
    <div id="toolbox" class="glass">
        <div id="tools">
            <div id="move-tool" class="tool active">
                <svg>
                    <polygon points="11.5,0 16.5,5 13,5 13,10 18,10 18,6.5 23,11.5 18,16.5 18,13 13,13 13,18 16.5,18 11.5,23 6.5,18 10,18 10,13 5,13 5,16.5 0,11.5 5,6.5 5,10 10,10 10,5 6.5,5"/>
                </svg>
            </div>
            <div id="draw-tool" class="tool">
                <svg>
                    <polygon points="0,0 6,2 23,19 19,23 2,6"/>
                    <line x1="2" y1="6" x2="6" y2="2"/>
                    <line x1="16" y1="20" x2="20" y2="16"/>
                </svg>
            </div>
            <div id="pick-tool" class="tool">
                <svg>
                    <polygon points="0,0 3,0 18,15 15,18 0,3"/>
                    <path d="M16,8 L18,10 C14,14 23,14 23,18  23,21 21,23 18,23  14,23 14,14 10,18 L8,16 Z"/>
                </svg>
            </div>
        </div>
        <div class="vr"></div>
        <div id="palette">
        </div>
    </div>
    <div id="picker" class="glass hidden">
        <div id="slider-h" class="slider"></div>
        <div id="slider-s" class="slider"></div>
        <div id="slider-l" class="slider"></div>
        <div class="hr"></div>
        <div id="slider-r" class="slider"></div>
        <div id="slider-g" class="slider"></div>
        <div id="slider-b" class="slider"></div>
        <div id="input-container">
            <input id="hex-input" type="text">
        </div>
    </div>
    <div id="tooltip" class="glass hidden"></div>
    <a id="downloader" download="pixels.png" hidden></a>
</body>
</html>
